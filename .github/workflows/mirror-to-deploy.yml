name: Mirror to deploy repo

# Cuando el workflow "CI" termina verde sobre main, espeja ese commit exacto
# al repo conectado a Railway (tucanchasena-tech/tucanchasena1), que dispara el deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  mirror:
    # Solo si el CI pasó y corrió sobre main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del commit que pasó el CI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar deploy key
        env:
          # Llave privada del deploy key. Acepta dos formatos de secret:
          #  - PEM cruda multilínea (-----BEGIN OPENSSH PRIVATE KEY----- ...)
          #  - misma llave codificada en base64 (una sola línea)
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Detecta el formato y normaliza a un archivo de llave válido.
          if printf '%s' "$MIRROR_SSH_KEY" | head -n1 | grep -q -- "-----BEGIN"; then
            # Llave PEM cruda: garantizar salto de línea final (evita "error in libcrypto").
            printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror_key
          else
            # Llave en base64: decodificar.
            printf '%s' "$MIRROR_SSH_KEY" | base64 -d > ~/.ssh/mirror_key
          fi
          chmod 600 ~/.ssh/mirror_key
          # Valida la llave; si está mal, el job falla aquí con un mensaje claro.
          ssh-keygen -y -f ~/.ssh/mirror_key > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push main al repo de deploy
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
        run: |
          git push --force \
            git@github.com:tucanchasena-tech/tucanchasena1.git \
            HEAD:main
